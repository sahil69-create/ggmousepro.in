<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - GG Mouse Pro</title>
    <meta name="description" content="Your GG Mouse Pro order has been successfully placed. View your order confirmation and order ID.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header role="banner">
        <div class="container">
            <nav aria-label="Main Navigation">
                <a href="index.html" class="logo" aria-label="GG Mouse Pro Home">GG Mouse Pro<span>.</span></a>
                <button class="mobile-menu-btn" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="nav-links">
                    <i class="fas fa-bars" aria-hidden="true"></i>
                </button>
                <ul class="nav-links" id="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="store.html">Store</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="hero" style="min-height: 80vh; padding-top: 120px; text-align: center;" aria-labelledby="confirmation-heading">
            <canvas id="bg-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.25;" aria-hidden="true"></canvas>
            <div class="container" style="position: relative; z-index: 2;">
                <i class="fas fa-check-circle" style="font-size: 4rem; color: var(--accent-orange); margin-bottom: 20px;" aria-hidden="true"></i>
                <h1 id="confirmation-heading" style="margin-bottom: 10px;"><span class="blue-text">Order</span> <span class="orange-text">Confirmed</span></h1>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">Thank you for your purchase. Your order has been successfully received and is being processed.</p>
                <div style="background: var(--bg-card); display: inline-block; padding: 20px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1);">
                    <div style="margin-bottom: 10px;">Order Reference ID</div>
                    <div id="order-id" style="font-family: var(--font-heading); font-size: 1.2rem;"></div>
                </div>
                <div style="margin-top: 25px;">
                    <a href="store.html" class="btn btn-primary">Continue Shopping</a>
                </div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <div class="container">
            <div class="text-center">
                <p>&copy; 2026 GG Mouse Pro. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js" defer></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('orderId');
        document.getElementById('order-id').textContent = id || 'Unknown';
    </script>
</body>
</html>
